version: 2
updates:
  # npm: one grouped PR a month for minor/patch updates; a major update gets its own PR.
  # neural-server/ is left out: CI does not install or test it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
