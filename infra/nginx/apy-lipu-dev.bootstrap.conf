# Bootstrap variant of apy-lipu-dev.conf, used by infra/host/provision.sh
# while the host has no certificate yet (DNS still on the old host). Same
# routes on plain HTTP so the box can be tested with
#   curl --resolve apy.lipu.dev:80:<new-ip> http://apy.lipu.dev/listPairs
# infra/host/issue-cert.sh replaces it with apy-lipu-dev.conf.
server {
  listen 80;
  listen [::]:80;
  server_name apy.lipu.dev;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  location ~ ^/(status|operation|rebuild|pull-repo|build-repo)$ {
    proxy_pass http://127.0.0.1:8081;
    proxy_read_timeout 1800s;
  }
  location / {
    proxy_pass http://127.0.0.1:2737;
    proxy_read_timeout 120s;
  }
}
