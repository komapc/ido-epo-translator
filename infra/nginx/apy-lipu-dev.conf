# TLS entry point for the Cloudflare worker (#70).
# Installed as /etc/nginx/sites-available/apy-lipu-dev. Certificate from the
# certbot snap (webroot, renewed by its timer, deploy hook reloads nginx).

# Rate limits per client IP (security audit 2026-11-16). apy.lipu.dev is not behind the
# Cloudflare proxy, so $binary_remote_addr is the real peer. But the site's own traffic arrives
# from the Pages worker, i.e. from a handful of Cloudflare egress IPs shared by all visitors,
# so the APy limit is sized for that shared bucket, not for one person. Excess gets 429.
limit_req_zone $binary_remote_addr zone=apy_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=webhook_per_ip:1m rate=2r/s;
limit_req_status 429;

server {
  listen 80;
  listen [::]:80;
  server_name apy.lipu.dev;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name apy.lipu.dev;

  ssl_certificate /etc/letsencrypt/live/apy.lipu.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/apy.lipu.dev/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # /translate bodies: the worker caps text at 8000 chars, ~72 KB when urlencoded non-ASCII.
  client_max_body_size 128k;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # Webhook. Dictionary builds run for minutes, so no short read timeout.
  location ~ ^/(status|operation|rebuild|pull-repo|build-repo)$ {
    limit_req zone=webhook_per_ip burst=10 nodelay;
    proxy_pass http://127.0.0.1:8081;
    proxy_read_timeout 1800s;
  }

  # APy
  location / {
    limit_req zone=apy_per_ip burst=40 nodelay;
    proxy_pass http://127.0.0.1:2737;
    proxy_read_timeout 120s;
  }
}
