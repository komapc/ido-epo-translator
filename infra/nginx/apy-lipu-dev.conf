# TLS entry point for the Cloudflare worker (#70).
# Installed as /etc/nginx/sites-available/apy-lipu-dev. Certificate from the
# certbot snap (webroot, renewed by its timer, deploy hook reloads nginx).
server {
  listen 80;
  listen [::]:80;
  server_name apy.lipu.dev;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name apy.lipu.dev;

  ssl_certificate /etc/letsencrypt/live/apy.lipu.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/apy.lipu.dev/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # Webhook. Dictionary builds run for minutes, so no short read timeout.
  location ~ ^/(status|operation|rebuild|pull-repo|build-repo)$ {
    proxy_pass http://127.0.0.1:8081;
    proxy_read_timeout 1800s;
  }

  # APy
  location / {
    proxy_pass http://127.0.0.1:2737;
    proxy_read_timeout 120s;
  }
}
